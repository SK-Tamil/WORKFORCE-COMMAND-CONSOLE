apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: office-frontend-hpa
  namespace: office-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: office-frontend

  minReplicas: 2
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
